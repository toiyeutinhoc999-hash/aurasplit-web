<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AuraSplit AI - Web Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-lg border border-slate-700">
        <h1 class="text-3xl font-bold text-center mb-6 text-purple-400">🎵 AuraSplit AI Web</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Chọn file nhạc (MP3, WAV, FLAC):</label>
            <input type="file" id="audioFile" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 cursor-pointer">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Chọn chế độ tách:</label>
            <select id="splitMode" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2">
                <option value="vocal_beat">🎤 Tách Vocal & Beat (Siêu sạch - Nhanh gọn)</option>
                <option value="stems">🎛️ Tách Đầy Đủ 4 Nhạc Cụ (Vocal, Drums, Bass, Other)</option>
            </select>
        </div>

        <!-- Khung hiển thị thông tin BPM & Key sau khi xử lý -->
        <div id="infoBox" class="hidden bg-slate-700/50 border border-slate-600 rounded-lg p-4 mb-4">
            <p class="text-rose-400 font-semibold mb-1" id="resBpm">⚡ Tốc độ: -- BPM</p>
            <p class="text-amber-400 font-semibold" id="resKey">🎼 Tông giọng: --</p>
        </div>

        <button onclick="uploadAudio()" id="btnSubmit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition duration-200">
            🚀 BẮT ĐẦU TÁCH & PHÂN TÍCH
        </button>

        <p id="statusText" class="text-center mt-4 text-sm text-sky-400 font-semibold"></p>
    </div>

    <script>
        async function uploadAudio() {
            const fileInput = document.getElementById('audioFile');
            const mode = document.getElementById('splitMode').value;
            const statusText = document.getElementById('statusText');
            const btn = document.getElementById('btnSubmit');
            const infoBox = document.getElementById('infoBox');

            if (fileInput.files.length === 0) {
                alert("Vui lòng chọn một file nhạc!");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("mode", mode);

            btn.disabled = true;
            btn.classList.add('opacity-50');
            statusText.innerText = "⏳ AI đang phân tích BPM, Key và tách nhạc...";
            infoBox.classList.add('hidden');

            try {
                // Đã chuyển thành đường dẫn tương đối để chạy trực tiếp trên Render
                const response = await fetch('/api/split', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.status === "success") {
                    statusText.innerText = "🎉 Xử lý thành công!";
                    document.getElementById('resBpm').innerText = `⚡ Tốc độ: ${result.bpm} BPM`;
                    document.getElementById('resKey').innerText = `🎼 Tông giọng: ${result.key} Major/Minor`;
                    infoBox.classList.remove('hidden');
                } else {
                    statusText.innerText = "❌ Lỗi hệ thống xử lý.";
                }
            } catch (err) {
                statusText.innerText = "❌ Lỗi kết nối đến máy chủ!";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
