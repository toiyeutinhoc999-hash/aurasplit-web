<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraSplit AI Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #a855f7;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #9333ea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #7e22ce;
        }
        .download-section {
            text-align: center;
            padding: 30px;
            background: #1a1a1a;
            color: white;
            border-radius: 10px;
            margin: 30px auto 0 auto;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        .download-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .download-btn-win {
            background: #0078d7;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }
        .download-btn-win:hover {
            background: #005a9e;
        }
        .download-btn-mac {
            background: #333333;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #555;
            display: inline-block;
            transition: background 0.3s;
        }
        .download-btn-mac:hover {
            background: #444444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 AuraSplit AI Studio</h1>
        <p style="text-align: center; color: #aaa;">Hệ thống tách stem nhạc bằng Trí Tuệ Nhân Tạo</p>
        
        <!-- Khu vực chức năng web -->
        <div style="margin-top: 20px;">
            <input type="file" id="audioFile" style="margin-bottom: 15px; color: #fff;"><br>
            <button class="btn" onclick="alert('Đã sẵn sàng tách nhạc!')">BẮT ĐẦU TÁCH STEMS</button>
        </div>
    </div>

    <!-- KHU VỰC TẢI PHẦN MỀM CHO WIN VÀ MAC -->
    <div class="download-section">
        <h2>Tải Ứng Dụng AuraSplit AI Studio</h2>
        <p>Trải nghiệm phần mềm tách nhạc AI mạnh mẽ trực tiếp trên máy tính của bạn với giao diện Desktop chuyên nghiệp!</p>
        
        <div class="download-buttons">
            <!-- Nút tải cho Windows (Trỏ thẳng vào file .exe trong thư mục downloads) -->
            <a href="/downloads/AuraSplit_Installer_Windows.exe" class="download-btn-win">
                📥 Tải cho Windows (Win)
            </a>
            
            <!-- Nút tải cho macOS -->
            <a href="#" class="download-btn-mac">
                🍏 Tải cho macOS (Mac - Sắp ra mắt)
            </a>
        </div>
    </div>

</body>
</html>
